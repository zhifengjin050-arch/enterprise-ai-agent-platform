[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "enterprise-ai-agent-platform"
version = "1.0.0"
description = "Enterprise AI Agent Platform — Knowledge Management, AI Agent, Workflow Automation, Knowledge Graph & Enterprise Security"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Enterprise AI Team" },
]

keywords = [
    "ai-agent", "knowledge-management", "rag", "workflow-automation",
    "enterprise-search", "knowledge-graph", "fastapi", "llm",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Enterprise",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]",
    "sqlalchemy>=2.0.35",
    "alembic",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "bcrypt",
    "prometheus-client>=0.26.0",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "langgraph>=0.2.0",
    "chromadb>=0.5.0",
    "PyMuPDF",
    "python-docx",
    "markdown",
    "python-frontmatter",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite",
    "asyncpg",
    "redis",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "W",  # warnings
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
ignore_errors = true
# Baseline: run `mypy app/` to type-check; errors are informational for now.

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B303", "B311", "B324"]
# Baseline: bandit -r app/ -f json -o bandit-report.json