apiVersion: v1
kind: Secret
metadata:
  name: enterprise-ai-secrets
  namespace: default
  labels:
    app.kubernetes.io/name: enterprise-ai-platform
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # PostgreSQL password (base64 encoded)
  # Default: postgres => cG9zdGdyZXM=
  # Override in production using External Secrets Operator or Vault
  postgres-password: "cG9zdGdyZXM="

  # JWT secret (base64 encoded)
  # Default: change-me-in-production => Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24=
  # Override in production with a cryptographically random value
  jwt-secret: "Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24="

  # LLM API Key (base64 encoded)
  # Default: placeholder — set your actual LLM API key in production
  # Example: "sk-xxx..." => base64: c2steHh4Li4u
  llm-api-key: "cGxhY2Vob2xkZXItbGxtLWtleQ=="  # base64("placeholder-llm-key")

  # Grafana admin password (base64 encoded)
  # Default: admin => YWRtaW4=
  grafana-password: "YWRtaW4="