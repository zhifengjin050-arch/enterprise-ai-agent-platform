apiVersion: v1
kind: Service
metadata:
  name: enterprise-ai-backend-service
  namespace: default
  labels:
    app.kubernetes.io/name: enterprise-ai-platform
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: enterprise-ai-platform
    app.kubernetes.io/component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-ai-frontend-service
  namespace: default
  labels:
    app.kubernetes.io/name: enterprise-ai-platform
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: enterprise-ai-platform
    app.kubernetes.io/component: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: default
  labels:
    app.kubernetes.io/name: enterprise-ai-platform
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: default
  labels:
    app.kubernetes.io/name: enterprise-ai-platform
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: redis
---
apiVersion: v1
kind: Service
metadata:
  name: chroma-service
  namespace: default
  labels:
    app.kubernetes.io/name: enterprise-ai-platform
    app.kubernetes.io/component: chroma
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: chroma
  selector:
    app.kubernetes.io/name: chroma