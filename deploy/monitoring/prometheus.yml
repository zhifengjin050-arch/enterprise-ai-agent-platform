# Prometheus configuration for Enterprise AI Knowledge Copilot
# Phase 8: Observability & AI Operations Platform

global:
  scrape_interval:     15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "enterprise-knowledge-agent"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: "/metrics"
    scheme: http
    scrape_interval: 10s

    # Relabel to attach service name
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "(.+)"
        target_label: service
        replacement: "enterprise-knowledge-agent"