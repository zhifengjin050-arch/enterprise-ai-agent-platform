{{- $fullname := include "enterprise-ai-platform.fullname" . }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.serviceName | default (printf "%s-backend" $fullname) }}
  namespace: {{ .Values.global.namespace | default "default" }}
  labels:
    {{- include "enterprise-ai-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
      protocol: TCP
      name: {{ .Values.backend.service.portName | default "http" }}
  selector:
    {{- include "enterprise-ai-platform.backendSelectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.frontend.serviceName | default (printf "%s-frontend" $fullname) }}
  namespace: {{ .Values.global.namespace | default "default" }}
  labels:
    {{- include "enterprise-ai-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}
      protocol: TCP
      name: {{ .Values.frontend.service.portName | default "http" }}
  selector:
    {{- include "enterprise-ai-platform.frontendSelectorLabels" . | nindent 4 }}
---
# Infrastructure services — defined here for convenience
# These are typically managed externally; set enabled=false to skip
{{- if $.Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Values.postgresql.service.name }}
  namespace: {{ $.Values.global.namespace | default "default" }}
  labels:
    {{- include "enterprise-ai-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: {{ $.Values.postgresql.service.port }}
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: postgres
{{- end }}
{{- if $.Values.redis.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Values.redis.service.name }}
  namespace: {{ $.Values.global.namespace | default "default" }}
  labels:
    {{- include "enterprise-ai-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: {{ $.Values.redis.service.port }}
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: redis
{{- end }}
{{- if $.Values.chroma.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Values.chroma.service.name }}
  namespace: {{ $.Values.global.namespace | default "default" }}
  labels:
    {{- include "enterprise-ai-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: chroma
spec:
  type: ClusterIP
  ports:
    - port: {{ $.Values.chroma.service.port }}
      targetPort: 8000
      protocol: TCP
      name: chroma
  selector:
    app.kubernetes.io/name: chroma
{{- end }}