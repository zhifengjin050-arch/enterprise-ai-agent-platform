{{- $fullname := include "enterprise-ai-platform.fullname" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secrets" $fullname }}
  namespace: {{ .Values.global.namespace | default "default" }}
  labels:
    {{- include "enterprise-ai-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Provide plaintext values here; Kubernetes will base64-encode them automatically.
  # In production, consider using External Secrets Operator or Vault.
  {{- if .Values.backend.secrets.postgresPassword }}
  postgres-password: {{ .Values.backend.secrets.postgresPassword | quote }}
  {{- else }}
  postgres-password: "postgres"
  {{- end }}
  {{- if .Values.backend.secrets.jwtSecret }}
  jwt-secret: {{ .Values.backend.secrets.jwtSecret | quote }}
  {{- else }}
  jwt-secret: "change-me-in-production"
  {{- end }}
  {{- if .Values.backend.secrets.llmApiKey }}
  llm-api-key: {{ .Values.backend.secrets.llmApiKey | quote }}
  {{- else }}
  llm-api-key: ""
  {{- end }}
  {{- if .Values.backend.secrets.grafanaPassword }}
  grafana-password: {{ .Values.backend.secrets.grafanaPassword | quote }}
  {{- else }}
  grafana-password: "admin"
  {{- end }}