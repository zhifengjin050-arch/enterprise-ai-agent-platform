<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo · Enterprise AI Agent Platform</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #050814; color: #e8eef8; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    body {
      background:
        radial-gradient(900px 420px at 50% 12%, rgba(59,130,246,.22), transparent 70%),
        linear-gradient(180deg, #0b1220 0%, #050814 100%);
    }
    main { max-width: 1100px; margin: 0 auto; padding: 36px 20px 56px; }
    .kicker { letter-spacing: .28em; text-transform: uppercase; color: #60a5fa; font-size: 13px; font-weight: 700; margin: 0 0 10px; }
    h1 { font-size: clamp(28px, 4vw, 44px); margin: 0 0 8px; line-height: 1.2; }
    .sub { color: #94a3b8; margin: 0 0 24px; font-size: 16px; }
    video {
      width: 100%; border-radius: 14px; background: #000;
      box-shadow: 0 24px 64px rgba(0,0,0,.45);
    }
    nav { margin-top: 18px; color: #64748b; font-size: 14px; }
    a { color: #7dd3fc; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Project 3</p>
    <h1>Enterprise AI Agent Platform</h1>
    <p class="sub">知识库 · Agent · 工作流 · 中文旁白 · 底部字幕</p>
    <video controls playsinline preload="metadata" poster="videos/cover.png">
      <source src="videos/demo.mp4" type="video/mp4" />
    </video>
    <nav>
      <a href="https://github.com/zhifengjin050-arch/enterprise-ai-agent-platform">返回 GitHub 仓库</a>
    </nav>
  </main>
</body>
</html>
